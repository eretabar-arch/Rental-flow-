<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NEAR Drive Admin</title><style>:root{--bg:#07110f;--panel:#0d1916;--line:#22332d;--text:#f3f7f4;--muted:#9eb0a9;--green:#b9ff38;--cream:#eef2ed;--ink:#0a1713}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1220px;margin:auto;padding:0 20px}header{height:72px;border-bottom:1px solid #ffffff18;display:flex;align-items:center}.head{display:flex;justify-content:space-between;align-items:center;width:100%}.brand{font-weight:950;font-size:24px}.brand span{color:var(--green)}button,input,select,textarea{font:inherit}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:900;cursor:pointer}.primary{background:var(--green);color:#142007}.ghost{background:#15231e;color:#fff;border:1px solid #30443b}.login{max-width:520px;margin:80px auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px}.login h1{font-size:38px;letter-spacing:-1.5px;margin:10px 0}.login p,.muted{color:var(--muted);line-height:1.55}.login input{width:100%;height:52px;border-radius:12px;border:1px solid #33483f;background:#07110f;color:#fff;padding:0 13px;margin:14px 0}.app{display:none;padding:36px 0 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.top h1{font-size:42px;margin:0;letter-spacing:-1.8px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.stat small{color:var(--muted);font-weight:800}.stat b{display:block;font-size:26px;color:var(--green);margin-top:6px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters button{border:1px solid #2b4137;background:#102019;color:#dce7e2;border-radius:99px;padding:8px 11px;font-size:11px;font-weight:850;cursor:pointer}.filters button.active{background:var(--green);color:#172306}.cards{display:grid;gap:12px}.card{background:#f5f7f5;color:var(--ink);border-radius:20px;padding:18px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px}.code{font-size:12px;font-weight:950;color:#557800}.card h2{margin:5px 0 7px;font-size:22px}.badge{display:inline-block;border-radius:99px;padding:6px 9px;background:#e8efe9;font-size:10px;font-weight:900}.money{font-size:24px;font-weight:950}.meta{font-size:12px;color:#63736c;line-height:1.6}.adminFields{display:grid;gap:8px}.adminFields input,.adminFields select,.adminFields textarea{width:100%;border:1px solid #d1dad5;border-radius:10px;padding:9px;background:#fff;color:#142118}.adminFields textarea{min-height:64px;resize:vertical}.save{background:#0d1916;color:#fff}.next{background:#eaf7c8;border:1px solid #c6df86;border-radius:14px;padding:12px;margin-bottom:10px}.next small{display:block;color:#65734f;font-weight:900;letter-spacing:1px}.next b{display:block;margin-top:4px;font-size:15px}.profit{margin-top:12px;background:#eef6ef;border-radius:12px;padding:11px}.profit b{color:#416600}.voucher{background:#b9ff38;color:#142007}.voucher:disabled{opacity:.45;cursor:not-allowed}.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed #33463f;border-radius:18px}.error{color:#ff9b91;font-size:12px;margin-top:10px}.success{color:var(--green);font-size:12px;margin-top:10px}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.card{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.stats{grid-template-columns:1fr}.top h1{font-size:34px}}</style></head><body><header><div class="wrap head"><div class="brand">NEAR <span>DRIVE</span> <small style="font-size:10px;color:#82958c">ADMIN</small></div><button class="btn ghost" id="logout" style="display:none">Sign out</button></div></header><main class="wrap"><section class="login" id="login"><div style="color:var(--green);font-size:11px;font-weight:900;letter-spacing:2px">PRIVATE OPERATIONS</div><h1>Reservation control.</h1><p>Enter the authorized administration email. We will send a secure sign-in link—no password is stored on this page.</p><input id="email" type="email" placeholder="Admin email"><button class="btn primary" id="magic">SEND SECURE LOGIN LINK →</button><div id="loginMsg"></div></section><section class="app" id="app"><div class="top"><div><div style="color:var(--green);font-size:11px;font-weight:900;letter-spacing:2px">NEAR DRIVE OPERATIONS</div><h1>Reservations</h1><div class="muted" id="who"></div></div><button class="btn ghost" id="refresh">Refresh</button></div><div class="stats"><div class="stat"><small>Supplier pending</small><b id="sPending">0</b></div><div class="stat"><small>Confirmed</small><b id="sConfirmed">0</b></div><div class="stat"><small>Voucher sent</small><b id="sVoucher">0</b></div><div class="stat"><small>Gross sales</small><b id="sGross">$0</b></div><div class="stat"><small>Gross profit</small><b id="sProfit">$0</b></div></div><div class="filters" id="filters"><button class="active" data-status="ALL">ALL</button><button data-status="SUPPLIER_PENDING">SUPPLIER PENDING</button><button data-status="CONFIRMED_WITH_SUPPLIER">CONFIRMED</button><button data-status="VOUCHER_SENT">VOUCHER SENT</button><button data-status="COMPLETED">COMPLETED</button><button data-status="CANCELLED">CANCELLED</button></div><div class="cards" id="cards"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script>
const SUPABASE_URL='https://oxatqxaddtkjnyfrvmot.supabase.co';
const SUPABASE_KEY='sb_publishable_4cidR7RuGWYAOOrLsLA82A_n_Gkr1WG';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{detectSessionInUrl:true,persistSession:true}});
let all=[],filter='ALL';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){const {data:{session}}=await db.auth.getSession();if(session)showApp(session);else showLogin()}
function showLogin(){login.style.display='block';app.style.display='none';logout.style.display='none'}
async function showApp(session){login.style.display='none';app.style.display='block';logout.style.display='block';who.textContent=session.user.email||'';await load()}
magic.onclick=async()=>{const v=email.value.trim();loginMsg.className='';loginMsg.textContent='';if(!/^\S+@\S+\.\S+$/.test(v)){loginMsg.className='error';loginMsg.textContent='Enter a valid email.';return}magic.disabled=true;const {error}=await db.auth.signInWithOtp({email:v,options:{emailRedirectTo:location.origin+'/admin',shouldCreateUser:true}});magic.disabled=false;loginMsg.className=error?'error':'success';loginMsg.textContent=error?error.message:'Secure login link sent. Open it from this device.'}
logout.onclick=async()=>{await db.auth.signOut();showLogin()};refresh.onclick=load;
db.auth.onAuthStateChange((event,session)=>{if(session)showApp(session);else if(event==='SIGNED_OUT')showLogin()});
async function load(){cards.innerHTML='<div class="empty">Loading reservations…</div>';const {data,error}=await db.from('near_drive_reservations').select('*').order('created_at',{ascending:false}).limit(200);if(error){cards.innerHTML='<div class="empty">Access denied or unable to load reservations.<br><small>'+esc(error.message)+'</small></div>';return}all=data||[];render()}
function nextAction(r){if(r.status==='CANCELLED')return 'No action · cancelled';if(r.status==='COMPLETED')return 'Closed · completed';if(!r.supplier_name)return 'Book with rental supplier';if(!r.supplier_confirmation_number)return 'Enter supplier confirmation number';if(!r.supplier_paid)return 'Pay rental supplier';if(r.status==='SUPPLIER_PENDING')return 'Mark confirmed with supplier';if(r.status==='CONFIRMED_WITH_SUPPLIER')return 'Send final voucher to customer';if(r.status==='VOUCHER_SENT')return 'Monitor pickup';if(r.status==='VEHICLE_PICKED_UP')return 'Mark completed after rental';return 'Review reservation'}
function render(){sPending.textContent=all.filter(x=>x.status==='SUPPLIER_PENDING').length;sConfirmed.textContent=all.filter(x=>x.status==='CONFIRMED_WITH_SUPPLIER').length;sVoucher.textContent=all.filter(x=>x.status==='VOUCHER_SENT').length;const active=all.filter(x=>x.payment_status==='PAID_TO_NEAR'&&x.status!=='CANCELLED');sGross.textContent='$'+active.reduce((a,x)=>a+Number(x.total||0),0).toLocaleString(undefined,{maximumFractionDigits:0});sProfit.textContent='$'+active.reduce((a,x)=>a+(x.supplier_cost==null?0:Number(x.total||0)-Number(x.supplier_cost||0)),0).toLocaleString(undefined,{maximumFractionDigits:0});const list=filter==='ALL'?all:all.filter(x=>x.status===filter);cards.innerHTML=list.length?list.map(card).join(''):'<div class="empty">No reservations in this status.</div>'}
function card(r){const profit=r.supplier_cost==null?null:Number(r.total||0)-Number(r.supplier_cost||0),margin=profit==null||!Number(r.total)?null:Math.round(profit/Number(r.total)*100);return `<article class="card" data-id="${r.id}"><div><div class="next"><small>NEXT ACTION</small><b>${esc(nextAction(r))}</b></div><div class="code">${esc(r.code)}</div><h2>${esc(r.vehicle)}</h2><span class="badge">${esc(r.status.replaceAll('_',' '))}</span><div class="meta" style="margin-top:10px"><b>${esc(r.customer_first_name)} ${esc(r.customer_last_name)}</b><br>${esc(r.customer_email)}<br>${esc(r.customer_phone)}<br><br>${esc(r.pickup||'—')} → ${esc(r.destination||'—')}<br>${esc(r.start_date||'—')} → ${esc(r.end_date||'—')}</div></div><div><div class="money">$${Number(r.total||0).toFixed(2)}</div><div class="meta">Customer paid to NEAR<br>Rental balance at desk: <b>$0</b><br>Security deposit: <b>$${Number(r.deposit||0).toFixed(2)}</b><br>Supplier cost: <b>${r.supplier_cost==null?'—':'$'+Number(r.supplier_cost).toFixed(2)}</b></div><div class="profit"><small>GROSS PROFIT</small><br><b>${profit==null?'Enter supplier cost':'$'+profit.toFixed(2)+(margin==null?'':' · '+margin+'% margin')}</b></div><div class="meta" style="margin-top:12px">Flight: ${esc(r.flight_number||'—')}<br>Delivery: ${esc(r.delivery_address||'—')}<br>Extras: ${esc((r.extras||[]).join(', ')||'None')}</div></div><div class="adminFields"><select data-f="status">${['SUPPLIER_PENDING','CONFIRMED_WITH_SUPPLIER','VOUCHER_SENT','VEHICLE_PICKED_UP','COMPLETED','CANCELLED'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select><input data-f="supplier_name" placeholder="Rental company" value="${esc(r.supplier_name||'')}"><input data-f="supplier_confirmation_number" placeholder="Supplier confirmation #" value="${esc(r.supplier_confirmation_number||'')}"><input data-f="supplier_cost" type="number" step="0.01" min="0" placeholder="Supplier cost" value="${r.supplier_cost??''}"><label class="meta"><input data-f="supplier_paid" type="checkbox" ${r.supplier_paid?'checked':''}> Supplier paid by NEAR</label><textarea data-f="admin_notes" placeholder="Internal notes">${esc(r.admin_notes||'')}</textarea><button class="btn save" onclick="save(${r.id},this)">SAVE RESERVATION</button><button class="btn voucher" onclick="sendVoucher(${r.id},this)" ${(!r.supplier_name||!r.supplier_confirmation_number||r.status==='CANCELLED')?'disabled':''}>SEND FINAL VOUCHER →</button><div class="meta" data-msg></div></div></article>`}
async function save(id,btn){const el=btn.closest('.card'),g=n=>el.querySelector(`[data-f="${n}"]`),status=g('status').value;const payload={status,supplier_name:g('supplier_name').value.trim()||null,supplier_confirmation_number:g('supplier_confirmation_number').value.trim()||null,supplier_cost:g('supplier_cost').value===''?null:Number(g('supplier_cost').value),supplier_paid:g('supplier_paid').checked,admin_notes:g('admin_notes').value.trim()||null,updated_at:new Date().toISOString()};if(status==='CONFIRMED_WITH_SUPPLIER'&&!all.find(x=>x.id===id)?.confirmed_at)payload.confirmed_at=new Date().toISOString();if(status==='VOUCHER_SENT'&&!all.find(x=>x.id===id)?.voucher_sent_at)payload.voucher_sent_at=new Date().toISOString();btn.disabled=true;const {error}=await db.from('near_drive_reservations').update(payload).eq('id',id);btn.disabled=false;const msg=el.querySelector('[data-msg]');msg.textContent=error?error.message:'Saved';msg.style.color=error?'#a52a2a':'#527400';if(!error)await load()}
async function sendVoucher(id,btn){const el=btn.closest('.card'),msg=el.querySelector('[data-msg]'),{data:{session}}=await db.auth.getSession();if(!session){msg.textContent='Session expired. Sign in again.';return}btn.disabled=true;msg.textContent='Sending voucher…';try{const r=await fetch('/api/voucher',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({id})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to send voucher');msg.textContent='Voucher sent to customer';msg.style.color='#527400';await load()}catch(e){msg.textContent=e.message;msg.style.color='#a52a2a';btn.disabled=false}}

filters.onclick=e=>{if(e.target.tagName!=='BUTTON')return;filter=e.target.dataset.status;[...filters.children].forEach(b=>b.classList.toggle('active',b===e.target));render()};
init();
</script></body></html>
