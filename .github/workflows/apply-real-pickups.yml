name: Apply NEAR Drive Pickup Locations
on:
  push:
    paths:
      - 'scripts/apply-real-pickup-locations.py'
      - '.github/workflows/apply-real-pickups.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply pickup locations
        run: python scripts/apply-real-pickup-locations.py
      - name: Commit generated website
        run: |
          git config user.name "near-drive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add unique Costa Rica pickup locations"
          git pull --rebase origin main
          git push origin HEAD:main
