name: Apply NEAR Drive Route Experience
on:
  push:
    paths:
      - 'scripts/apply-route-experience.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-route-experience.py
      - name: Commit generated website
        run: |
          git config user.name "near-drive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add scenic Route Experience to NEAR Drive"
          git push
