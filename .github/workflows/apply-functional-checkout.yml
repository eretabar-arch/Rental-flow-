name: Apply Functional Checkout
on:
  push:
    paths:
      - '.github/workflows/apply-functional-checkout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_checkout.py
      - run: |
          git config user.name "near-drive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make NEAR Drive checkout functional" || exit 0
          git push
