name: Apply Reservation Storage Check
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-reservation-storage-check.cjs'
      - '.github/workflows/apply-reservation-storage-check.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-reservation-storage-check.cjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "near-drive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Require stored reservation before checkout success"
          git push
